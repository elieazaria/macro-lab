name: Macro Lab — Scraping horaire

# Se déclenche toutes les heures, à la minute 5 (évite la charge pile
# à l'heure pile sur les runners GitHub), + déclenchement manuel possible.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: macro-lab-scrape
  cancel-in-progress: false

jobs:
  scrape-score-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Installation des dépendances
        run: pip install -r scraper/requirements.txt

      - name: Exécution du pipeline (scrape + scoring + prédictions)
        run: python -m scraper.run

      - name: Commit et push des données mises à jour
        run: |
          git config user.name "macro-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ public/data/
          if git diff --cached --quiet; then
            echo "Rien de nouveau à committer."
          else
            git commit -m "chore(data): mise à jour automatique $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
